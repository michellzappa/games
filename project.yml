name: EST
options:
  bundleIdPrefix: com.centaur-labs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30.0"
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic

packages:
  GameShell:
    path: Packages/GameShell
  GridKit:
    path: Packages/GridKit

targets:
  EST:
    type: application
    platform: iOS
    sources:
      - path: EST
    dependencies:
      - package: GameShell
      - package: GridKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 160
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "EST"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconOrchard AppIconDusk"
        PRODUCT_BUNDLE_IDENTIFIER: com.centaur-labs.est
        # First-party EST endpoint; distributors may override this build
        # setting with the URL of their own telemetry Worker.
        INFOPLIST_KEY_ESTTelemetryEndpoint: "https://est-telemetry.envisioning.workers.dev/v1/batches"
        INFOPLIST_KEY_ESTFeedbackEndpoint: "https://est-telemetry.envisioning.workers.dev/v1/feedback"
    entitlements:
      path: EST/EST.entitlements
      properties:
        com.apple.developer.game-center: true
    resources:
      - path: EST/Resources/Assets.xcassets

  ESTUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ESTUITests
    dependencies:
      - target: EST
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centaur-labs.est.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: EST

  ESTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ESTTests
    dependencies:
      - target: EST
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centaur-labs.est.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: EST

schemes:
  EST:
    build:
      targets:
        EST: all
    run:
      config: Release
      debugEnabled: false
      storeKitConfiguration: Config/ESTSupport.storekit
    test:
      config: Debug
      targets:
        - ESTUITests
        - ESTTests
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
